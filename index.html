<head>
  <title>Casa Arrayanes Guadalajara</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</head>
<body>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
        }
        .container-fluid {
            height: 100%;
            padding: 0;
        }
        .carousel, .carousel-inner, .carousel-inner > .item {
            height: 100%;
        }
        .carousel-inner > .item > img,
        .carousel-inner > .item > a > img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            margin: auto;
        }
    </style>

<div class="container-fluid">
  <div id="theCarousel" class="carousel slide" data-ride="carousel">
    <!-- Indicadores -->
    <ol class="carousel-indicators">
      <li data-target="#theCarousel" data-slide-to="0" class="active"></li>
      <li data-target="#theCarousel" data-slide-to="1"></li>
      <li data-target="#theCarousel" data-slide-to="2"></li>
      <li data-target="#theCarousel" data-slide-to="3"></li>
    </ol>

    <div class="carousel-inner" role="listbox">
      <div class="item active">
        <img src="http://www.bcu.ac.uk/mediaitem/visual-communication-illustration-02-130585258441045504.jpg?quality=90" alt="Ilustracion" > 
         <div class="carousel-caption d-none d-md-block">
    <h3>Gusti Ilustración</h3>
    <p>Exposición</p>
  </div>
      </div>
    
      <div class="item">
        <img src="https://ugc.kn3.net/i/origin/http://thisiscolossal.com/wp-content/uploads/2011/02/anthony-2-600x424.jpg" alt="fotografia"> 
         <div class="carousel-caption d-none d-md-block">
    <h3> Xataka Fotografía</h3>
    <p>Concurso</p>
  </div>
      </div>

     <div class="item">
        <img src="https://mir-s3-cdn-cf.behance.net/project_modules/1400/e86e8b59124321.5a15e4ccd8622.jpg" alt="pintura">
         <div class="carousel-caption d-none d-md-block">
    <h3>DoArt Pintura</h3>
    <p>Curso</p>
  </div>
      </div>
       <div class="item">
        <img src="https://cdn.dribbble.com/users/324248/screenshots/3978513/planet2_800.jpg" alt="diseno"> 
         <div class="carousel-caption d-none d-md-block">
    <h3>UX UI Diseño Gráfico</h3>
    <p>Curso</p>
  </div>
      </div>
    </div> <!-- Cierre de carousel-inner (Faltaba en tu archivo original) -->

    <a class="left carousel-control" href="#theCarousel" role="button" data-slide="prev">
      <span class="glyphicon glyphicon-chevron-left" aria-hidden="true"></span>
      <span class="sr-only">anterior</span>
    </a>
    <a class="right carousel-control" href="#theCarousel" role="button" data-slide="next">
      <span class="glyphicon glyphicon-chevron-right" aria-hidden="true"></span>
      <span class="sr-only">siguiente</span>
    </a>
  </div>
</div>

<script>
  $(document).ready(function() {
      // Navegación Touch / Swipe
      var touchstartX = 0;
      var touchendX = 0;
      
      var carousel = document.getElementById('theCarousel');

      carousel.addEventListener('touchstart', function(event) {
          touchstartX = event.changedTouches[0].screenX;
      }, false);

      carousel.addEventListener('touchend', function(event) {
          touchendX = event.changedTouches[0].screenX;
          handleSwipe();
      }, false); 

      function handleSwipe() {
          if (touchendX < touchstartX - 50) {
              $('#theCarousel').carousel('next');
          }
          if (touchendX > touchstartX + 50) {
              $('#theCarousel').carousel('prev');
          }
      }
      
      // Navegación con flechas del teclado
      $(document).keydown(function(e) {
          if (e.keyCode === 37) {
             $('#theCarousel').carousel('prev'); // Flecha izquierda
          }
          if (e.keyCode === 39) {
             $('#theCarousel').carousel('next'); // Flecha derecha
          }
      });
  });
</script>
</body>
